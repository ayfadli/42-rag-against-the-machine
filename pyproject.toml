[project]
name = "rag-against-machine"
version = "0.1.0"
description = "A custom Retrieval-Augmented Generation (RAG) pipeline built in Python that indexes the vLLM codebase and uses a local Qwen model to accurately answer developer questions."
dependencies = [
    "bm25s>=0.3.16",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]
